# Partie locale : le serveur de jeu et votre bot.
#   docker compose up --build
# Suivez la partie sur http://localhost:8080
# Mode debug (le tour attend votre bot) : WAIT_FOR_ALL=1 docker compose up --build
services:
  server:
    # serveur de jeu fourni par l'organisation, sous forme d'image Docker
    image: "${SERVER_IMAGE:-docker.io/jfgauron/snowplow-server:2027}"
    ports:
      - "8080:8080"
    environment:
      TEAMS: "moi,equipe2,equipe3,equipe4"
      TICK_MS: "${TICK_MS:-400}"
      WAIT_FOR_ALL: "${WAIT_FOR_ALL:-0}"
      SEED: "${SEED:-}"

  bot-moi:
    build: .
    environment:
      SERVER_URL: "http://server:8080/teams/moi"
    command: ["python", "-c", "import sys, improved_bot; sys.modules['bot'] = improved_bot; import main; main.main()"]
    depends_on: [server]

  bot-equipe2:
    build: .
    environment:
      SERVER_URL: "http://server:8080/teams/equipe2"
    command: ["python", "-c", "import sys, good_opponent; sys.modules['bot'] = good_opponent; import main; main.main()"]
    depends_on: [server]

  bot-equipe3:
    build: .
    environment:
      SERVER_URL: "http://server:8080/teams/equipe3"
    command: ["python", "-c", "import sys, vibe_code_complicated_bot; sys.modules['bot'] = vibe_code_complicated_bot; import main; main.main()"]
    depends_on: [server]

  bot-equipe4:
    build: .
    environment:
      SERVER_URL: "http://server:8080/teams/equipe4"
    command: ["python", "-c", "import sys, good_opponent; sys.modules['bot'] = good_opponent; import main; main.main()"]
    depends_on: [server]
